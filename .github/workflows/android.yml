name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag version (e.g. v1.0.0). Leave as default to publish a release.'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Prepare Keystore for Release Signing
      run: |
        if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
          echo "Decoding keystore from repository secret..."
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
        elif [ -f "upload-keystore.base64" ]; then
          echo "Decoding keystore from committed upload-keystore.base64..."
          base64 -d upload-keystore.base64 > my-upload-key.jks
        else
          echo "Generating new keystore (fallback)..."
          keytool -genkey -v -keystore my-upload-key.jks \
            -storepass "${STORE_PASSWORD:-android}" \
            -alias upload \
            -keypass "${KEY_PASSWORD:-android}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AthanAlarm,O=AthanAlarm,C=CA"
        fi
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    - name: Build Release APK and AAB with Gradle
      run: ./gradlew assembleRelease bundleRelease
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    - name: Organize Release Artifacts
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/release/*.apk release-artifacts/AthanAlarm2.apk
        cp app/build/outputs/bundle/release/*.aab release-artifacts/AthanAlarm2.aab

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthanAlarm2-APK
        path: release-artifacts/AthanAlarm2.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthanAlarm2-AAB
        path: release-artifacts/AthanAlarm2.aab

    - name: Release Status Info
      if: "!startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || github.event.inputs.tag_name == '')"
      run: |
        echo "=========================================================================="
        echo "Build succeeded! Artifacts are ready in the Actions 'Artifacts' section."
        echo "No GitHub Release was created for this commit push to '${{ github.ref_name }}'."
        echo "To publish an official GitHub Release:"
        echo "  1. Run this workflow manually from GitHub Actions UI with a Tag (e.g. v1.0.0)"
        echo "  2. OR push a Git tag: git tag v1.0.0 && git push origin v1.0.0"
        echo "  3. OR draft a release at https://github.com/${{ github.repository }}/releases/new"
        echo "=========================================================================="

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
        files: |
          release-artifacts/AthanAlarm2.apk
          release-artifacts/AthanAlarm2.aab
        generate_release_notes: true
